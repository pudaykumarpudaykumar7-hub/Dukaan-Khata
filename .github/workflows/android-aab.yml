name: Android release build

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-aab.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release bundle (unsigned)
        working-directory: android
        run: gradle --no-daemon :app:bundleRelease

      - name: Upload unsigned AAB for build verification only
        uses: actions/upload-artifact@v4
        with:
          name: uvms-dukaan-khata-unsigned-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
